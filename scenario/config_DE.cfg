# DEFAULT config for the DE-wide r4mu simulation (run_de.py): the default scenario is the year 2024
# (self-contained: no previous scenario year needed). run_de.py reads this file when no --config_file is given.
#
#   python run_de.py                                   # default scenario (this file)
#   python run_de.py --ags 08111000 08115001           # quick test of single Gemeinden
#   python run_de.py --config_file config_DE_2037.cfg  # another scenario year (needs the results of 2024)
#
# Other scenario years (config_DE_2037.cfg, config_DE_2045.cfg) differ from this file only in: scenario_name,
# vehicle_input_file, simbev_pool_dir (the SimBEV profiles of that year), existing_infrastructure_gpkg (they use
# the previous year's results instead of BNetzA) and previous_scenario_dir. The result directory of a run is
# results/_DE_<date>_<time>; consolidate it with restructure_output_chunked.py (see run_final_chain_newgeo.sh).
#
# Unlike config.cfg/config_Berlin.cfg/config_stralsund.cfg/config_office.cfg
# (single-region, pre-simulated charging event timeseries, run via
# __main__.py), this config drives a nationwide run: charging events are
# sampled per Gemeinde from a pool of individually simulated SimBEV driving
# profiles (see vehicle_input.py), and candidate locations are drawn from the
# nationwide data_DE_new/*.gpkg layers, restricted per Gemeinde via VG250
# municipality boundaries (see data_de_candidates.py).

[data]
# nationwide candidate location layers (relative to project root)
data_dir = data_DE_new
# identifies this scenario year's own _prepared_<scenario_name>/ candidate
# cache (existing_points/existing_capacity_kw seeding differs per year, so
# scenario years can't share one _prepared/ cache even though data_dir - the
# underlying geographic candidates - is the same for all of them)
scenario_name = 2024
# vehicle counts per Gemeinde/RegioStaR7/car type
vehicle_input_file = scenario/input_vehicles_2024.xlsx
# which of vehicle_input.CAR_TYPE_COLUMNS' car types to actually sample -
# bev_heavy_duty_vehicle excluded: its SimBEV pool turned out to be
# parameterised as genuine N2/N3 heavy trucks (400 kWh batteries, MCS
# charging - a use case nothing in this pipeline places yet), not the N1
# (light commercial, <=3.5t) demand the input Excel's "N1-Fahrzeuge BEV"
# column is actually meant to represent.
vehicle_classes = bev_mini, phev_mini, bev_medium, phev_medium, bev_luxury, phev_luxury, bev_commercial, phev_commercial, bev_light_duty_vehicle
# pool of individually simulated SimBEV driving profiles for this scenario
# year, one subfolder per RegioStaR7-Typ (LR_Klein, LR_Mitte, LR_Zentr,
# SR_Gross, SR_Klein, SR_Metro, SR_Mitte)
simbev_pool_dir = simbev-profile/2024_2026-10-22_155455_simbev_run
# VG250 Gemeinde boundaries; downloaded automatically (see
# municipality_boundaries.py) if this file does not exist yet
municipality_boundaries = data_DE/municipalities_vg250.gpkg

# BNetzA Ladesaeulenregister (existing public charging infrastructure) - used
# to pre-seed retail/public/hpc_urban/hpc_highway with real existing capacity
# so the model fills it before proposing new locations (see
# existing_infrastructure.py). Not used for home/work (private charging).
# BNetzA only publishes its CURRENT snapshot (no archive of past export
# dates), so for this 2024 scenario existing_infrastructure_gpkg points at a
# 2024-12-01 snapshot instead (66,439 facilities vs. 115,411 in the current
# 2026-07-28 export - real infrastructure buildout since then would
# otherwise be counted as already existing in 2024) - see
# data_DE/bnetza_zenodo_2024_12_01/SOURCE.txt and existing_infrastructure.py's
# convert_zenodo_register_to_gpkg(). existing_infrastructure_xlsx below is
# unused as long as the gpkg already exists (convert_register_to_gpkg() is a
# no-op then) - kept only as a fallback reference for other scenario setups.
use_existing_infrastructure = true
existing_infrastructure_xlsx = data_DE/Ladesaeulenregister_BNetzA_2026-07-28.xlsx
existing_infrastructure_gpkg = data_DE/ladesaeulenregister_existing_infrastructure_2024.gpkg

# Multi-year scenario chain (see location_registry.py). The default scenario is a stand-alone 2024 run: no
# previous_scenario_dir. It has its own location registry so that it never mixes with the registry of a
# 2024 -> 2037 -> 2045 chain (config_DE_2024/2037/2045.cfg share data_DE_new/location_registry.parquet).
previous_scenario_dir =
location_registry_path = data_DE_new/location_registry_default.parquet

[basic]
# if true, shows and saves plots (not implemented for the DE flow yet)
plots = false
random_seed = 1
# charging-point efficiency: restructure_output.py multiplies the raw
# SimBEV grid-side average charging power by this to derive the battery-side
# average power column - 0.9 matches the fixed energy_battery/energy_grid
# ratio measured in the raw SimBEV output itself.
eta_cp = 0.9
# number of worker processes for multiprocessing.Pool; 0 = min(16, cpu_count()-1).
# process_gemeinde is I/O-heavy (reads hundreds-thousands of small SimBEV
# pool CSVs per Gemeinde); very high worker counts caused some tasks to hang
# indefinitely under disk I/O contention in testing. Raise this only after
# confirming your disk/AV setup handles more concurrent small-file reads.
n_workers = 16
# multi-use is just possible when retail (or work) and public are activated
multi_use_concept = false
# flexibility of start_time of shifted multi use charging event in timesteps
# (4 timesteps = 15 min), 48 = 12 Stunden
flexibility_multi_use = 0
# Group that is taken into account for multi-use: Private, Commercial
multi_use_group = Private, Commercial
# use-case to where charging events are distributed (retail or work possible)
use_case_multi_use = retail
# only needed if use_case_multi_use = work
share_office_parking = 0.4

[use_cases]
# decide which use cases to run
hpc = true
public = true
home = true
work = true
retail = true
depot = true

[uc_params]
# public: limit parking/charging duration on public street charging events
charging_time_limit = true
charging_time_limit_duration = 4
charging_time_limit_start = 9
charging_time_limit_end = 21
# upper limit of charging points per work location (single large employers otherwise collect thousands); 0 = no limit
work_max_charging_points = 1000
# upper limit of charging points per one-/two-family-house address; vehicles above it are placed on the Gemeinde's
# multi-family buildings (home_apartment); 0 = no limit (old behaviour)
home_detached_max_points = 2


[analysis]
# Master switch over all three reports (evaluation_report.xlsx,
# data_quality_report.html, dataset_report.html) - set to false to get just
# the six normalized tables and skip this whole phase, regardless of
# run_evaluation below.
build_reports = false
# if true, restructure_output.py builds evaluation_report.xlsx (RS7 summary,
# Kennzahlen, weekly load curves per use case) after writing the normalized
# tables - see build_evaluation_report.py. Set to false to skip it (it
# re-reads the large ev_event.parquet a few times, so it's not free).
run_evaluation = true
